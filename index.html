<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>notlovedbygod</title>
  <meta name="description" content="notlovedbygod">
  <style>
    :root {
      --bg: #ffffff;
      --text: #111111;
      --muted: #777777;
      --line: #e6e6e6;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0b0b0b;
        --text: #f2f2f2;
        --muted: #8a8a8a;
        --line: #222222;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0b0b0b;
      --text: #f2f2f2;
      --muted: #8a8a8a;
      --line: #222222;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 64px 16px;
    }
    main { width: 100%; max-width: 360px; }

    .avatar {
      width: 72px; height: 72px; border-radius: 50%;
      display: block; margin-bottom: 20px;
    }
    h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: -.01em; }
    .bio { color: var(--muted); font-size: .95rem; margin-top: 6px; line-height: 1.5; }

    ul { list-style: none; margin-top: 32px; border-top: 1px solid var(--line); }
    li { border-bottom: 1px solid var(--line); }
    a, button.link {
      display: flex; justify-content: space-between; align-items: center;
      width: 100%; padding: 14px 0;
      color: var(--text); text-decoration: none;
      background: none; border: 0; font: inherit; font-size: .95rem; text-align: left; cursor: pointer;
    }
    a:hover, button.link:hover { color: var(--muted); }
    .arrow { color: var(--muted); }

    .note { margin-top: 24px; font-size: .8rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <img class="avatar" src="https://github.com/notlovedbygod.png" alt="">
    <h1>notlovedbygod</h1>
    <p class="bio">not loved by god.</p>

    <ul>
      <li><a href="https://t.me/notlovedbygod" target="_blank" rel="noopener">Telegram <span class="arrow">↗</span></a></li>
      <li><a href="https://github.com/notlovedbygod" target="_blank" rel="noopener">GitHub <span class="arrow">↗</span></a></li>
      <li><button class="link" type="button" id="discord">Discord <span class="arrow" id="discordHint">скопировать ник</span></button></li>
      <li><a href="mailto:your@email.com">Email <span class="arrow">↗</span></a></li>
    </ul>
  </main>

  <script>
    // Ссылки и ник — замени на свои
    document.getElementById("discord").addEventListener("click", async () => {
      const hint = document.getElementById("discordHint");
      try {
        await navigator.clipboard.writeText("notlovedbygod");
        hint.textContent = "скопировано";
      } catch {
        hint.textContent = "notlovedbygod";
      }
      setTimeout(() => { hint.textContent = "скопировать ник"; }, 1600);
    });
  </script>
</body>
</html>
