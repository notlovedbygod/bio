<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мое Био</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; width: 100%; max-width: 400px; padding: 32px 24px; text-align: center; }
    .avatar { width: 96px; height: 96px; border-radius: 50%; border: 3px solid #38bdf8; margin-bottom: 16px; object-fit: cover; }
    h1 { font-size: 1.5rem; margin-bottom: 8px; }
    p { color: #94a3b8; font-size: 0.95rem; margin-bottom: 24px; }
    .links { display: flex; flex-direction: column; gap: 12px; }
    .link-btn { display: block; padding: 12px 16px; background: #334155; color: #ffffff; text-decoration: none; border-radius: 8px; font-weight: 500; transition: background 0.2s, transform 0.1s; }
    .link-btn:hover { background: #38bdf8; color: #0f172a; transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="card">
    <img class="avatar" src="https://avatars.githubusercontent.com/u/9919?v=4" alt="Avatar">
    <h1>Ваше Имя / Никнейм</h1>
    <p>Краткое описание, род деятельности или статус</p>
    
    <div class="links">
      <a href="https://t.me/ваш_username" class="link-btn" target="_blank">Telegram</a>
      <a href="https://github.com/ваш_username" class="link-btn" target="_blank">GitHub</a>
      <a href="https://youtube.com" class="link-btn" target="_blank">YouTube</a>
      <a href="mailto:your@email.com" class="link-btn">Связаться по почте</a>
    </div>
  </div>
</body>
</html>
